<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Happy Birthday 🎂</title>

<!-- ============================================================= -->
<!--  ✏️  EDIT THIS ONE BLOCK ONLY — everything else is automatic  -->
<!-- ============================================================= -->
<script>
const CARD = {
  // Her name (appears big on the card)
  name: "Aarthi",

  // The heartfelt message. Use \n for a new line.
  message:
    "Some people make the world a little brighter just by being themselves, " +
    "and today is a celebration of one of those people.\n\n" +
    "May your birthday be filled with genuine laughter, unforgettable " +
    "memories, and all the little moments that make life beautiful. 🌷\n\n" +
    "As you step into another wonderful year, I hope every dream you carry " +
    "finds its way to reality, every challenge turns into strength, and " +
    "every day brings you a new reason to smile. 🌈💖\n\n" +
    "May your heart always find peace, your mind always find confidence, " +
    "and your life always be surrounded by people who truly value you. 🌼\n\n" +
    "Thank you for being a part of my journey. I'll always wish the very " +
    "best for you.\n\n" +
    "Happy Birthday once again! 🥳🎂\n" +
    "May this year be your happiest one yet. ✨🌸💝",

  // Small signature at the bottom
  signature: "— With warmth and every good wish, always 🌸",

  // Photo file names. Put the image files inside the  photos/  folder
  // next to this file, then list their names here.
  photos: [
    "photo1.jpg",
    "photo2.jpg",
    "photo3.jpg",
    "photo4.jpg",
    "photo5.jpg",
    "photo6.jpg"
  ]
};
</script>
<!-- ============================================================= -->

<style>
  :root{
    --pink:#ff6fae; --gold:#ffd76a; --deep:#1a0b2e; --deep2:#2d0a3e;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    background:linear-gradient(160deg,#ff8ec6 0%,#ff6fae 32%,#e05fc4 60%,#a45fd8 100%);
    background-attachment:fixed;
    color:#fff;overflow-x:hidden;min-height:100vh;
    display:flex;flex-direction:column;align-items:center;
    position:relative;
  }

  /* floating hearts + sparkles background */
  .bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .float{position:absolute;bottom:-40px;font-size:22px;opacity:.55;
    animation:rise linear infinite}
  @keyframes rise{
    0%{transform:translateY(0) rotate(0);opacity:0}
    10%{opacity:.6}
    90%{opacity:.5}
    100%{transform:translateY(-115vh) rotate(360deg);opacity:0}
  }

  .card{
    position:relative;z-index:2;max-width:680px;width:92%;
    margin:6vh 0 8vh;text-align:center;
    animation:fadeUp 1.2s ease both;
  }
  @keyframes fadeUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}

  .cake{font-size:64px;letter-spacing:6px;
    filter:drop-shadow(0 6px 14px rgba(150,40,110,.45));
    animation:bob 3s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-12px)}}
  .panda-note{margin-top:8px;font-size:clamp(14px,2.3vw,17px);color:#fff;
    font-weight:600;letter-spacing:.3px;text-shadow:0 2px 12px rgba(150,40,110,.45)}

  h1{font-size:clamp(34px,7vw,64px);line-height:1.05;margin:6px 0 2px;
    font-weight:800;letter-spacing:.5px}
  h1 .hb{
    background:linear-gradient(90deg,var(--gold),#fff,var(--gold));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    background-size:200% auto;animation:shine 4s linear infinite}
  @keyframes shine{to{background-position:200% center}}

  .name{
    display:block;font-family:"Brush Script MT","Segoe Script",cursive;
    font-size:clamp(46px,11vw,92px);
    background:linear-gradient(90deg,#fff,#ffe6f3,#fff);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    margin-top:4px;text-shadow:0 3px 24px rgba(150,40,110,.45)}

  /* photo carousel */
  .frame{
    margin:30px auto 8px;width:min(340px,80vw);aspect-ratio:4/5;
    border-radius:20px;position:relative;overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 0 6px rgba(255,255,255,.08);
    background:rgba(255,255,255,.05);
  }
  .frame::after{content:"";position:absolute;inset:0;border-radius:20px;
    box-shadow:inset 0 0 60px rgba(255,111,174,.25);pointer-events:none}
  .slide{position:absolute;inset:0;opacity:0;transform:scale(1.08);
    transition:opacity 1.1s ease,transform 6s ease;
    background-size:cover;background-position:center}
  .slide.on{opacity:1;transform:scale(1)}
  .no-photo{display:flex;align-items:center;justify-content:center;
    height:100%;flex-direction:column;gap:10px;color:#ffd0e6;font-size:15px;
    text-align:center;padding:20px;line-height:1.6}
  .dots{display:flex;gap:8px;justify-content:center;margin:14px 0 4px}
  .dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.3);
    cursor:pointer;transition:.3s}
  .dot.on{background:var(--pink);transform:scale(1.3)}

  .msg{
    margin:26px auto 0;max-width:560px;font-size:clamp(16px,2.4vw,19px);
    line-height:1.85;color:#5b2a4d;white-space:pre-wrap;
    background:rgba(255,255,255,.82);backdrop-filter:blur(4px);
    padding:28px 26px;border-radius:22px;
    border:2px solid rgba(255,255,255,.9);
    box-shadow:0 16px 40px rgba(150,40,110,.25)}
  .sig{margin-top:18px;font-style:italic;color:#fff;font-size:17px;
    text-shadow:0 2px 12px rgba(150,40,110,.4)}

  .btn{margin:34px auto 0;display:inline-block;cursor:pointer;
    padding:14px 30px;border:none;border-radius:50px;font-size:17px;
    font-weight:700;color:#3a0d55;
    background:linear-gradient(90deg,var(--gold),#ffe9a8);
    box-shadow:0 10px 30px rgba(255,215,106,.4);transition:transform .2s}
  .btn:hover{transform:translateY(-3px) scale(1.04)}

  canvas.confetti{position:fixed;inset:0;pointer-events:none;z-index:5}
</style>
</head>
<body>
  <div class="bg" id="bg"></div>

  <div class="card">
    <div class="cake">🐼🎂🐼</div>
    <h1><span class="hb">Happy Birthday</span></h1>
    <span class="name" id="name">Name</span>
    <div class="panda-note">a little panda hug, just for you 🐼🎋💕</div>

    <div class="frame" id="frame"></div>
    <div class="dots" id="dots"></div>

    <div class="msg" id="msg"></div>
    <div class="sig" id="sig"></div>

    <button class="btn" id="celebrate">🎉 Celebrate</button>
  </div>

  <canvas class="confetti" id="cv"></canvas>

<script>
/* ---------- fill content ---------- */
document.title = "Happy Birthday " + CARD.name + " 🎂";
document.getElementById("name").textContent = CARD.name;
document.getElementById("msg").textContent = CARD.message;
document.getElementById("sig").textContent = CARD.signature;

/* ---------- floating hearts ---------- */
const bg = document.getElementById("bg");
const emojis = ["🐼","🐼","🎋","💖","🌸","🐾","🐼","💗","✨","🎀","🐼","🌷"];
for(let i=0;i<26;i++){
  const s=document.createElement("div");
  s.className="float";
  s.textContent=emojis[Math.floor(Math.random()*emojis.length)];
  s.style.left=Math.random()*100+"vw";
  s.style.fontSize=(14+Math.random()*24)+"px";
  s.style.animationDuration=(9+Math.random()*11)+"s";
  s.style.animationDelay=(-Math.random()*15)+"s";
  bg.appendChild(s);
}

/* ---------- photo carousel ---------- */
const frame=document.getElementById("frame");
const dotsWrap=document.getElementById("dots");
let slides=[],cur=0;

function buildGallery(){
  const list=CARD.photos.filter(Boolean);
  if(list.length===0){
    frame.innerHTML='<div class="no-photo">📷<br>Add her photos to the '+
      '<b>photos</b> folder<br>and list the file names in the script.</div>';
    return;
  }
  list.forEach((src,i)=>{
    const d=document.createElement("div");
    d.className="slide"+(i===0?" on":"");
    d.style.backgroundImage=`url("photos/${src}")`;
    frame.appendChild(d);
    slides.push(d);
    const dot=document.createElement("div");
    dot.className="dot"+(i===0?" on":"");
    dot.onclick=()=>go(i);
    dotsWrap.appendChild(dot);
  });
  if(list.length>1) setInterval(()=>go((cur+1)%slides.length),4200);
}
function go(n){
  slides[cur].classList.remove("on");
  dotsWrap.children[cur].classList.remove("on");
  cur=n;
  slides[cur].classList.add("on");
  dotsWrap.children[cur].classList.add("on");
}
buildGallery();

/* ---------- confetti celebration ---------- */
const cv=document.getElementById("cv"),ctx=cv.getContext("2d");
let W,H,parts=[];
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight}
size();addEventListener("resize",size);

const cols=["#ff4f93","#ff6fae","#ffb3d9","#ffd76a","#ffffff","#b388ff","#7ee8fa","#ff9ec7"];
const emo=["🐼","🌸","💖","🎋","🎀","🌷","✨"];

function spawn(x,y,ang,spread,power){
  const a=ang+(Math.random()-0.5)*spread;
  const sp=power*(0.55+Math.random()*0.7);
  const kind=Math.random();
  parts.push({
    x,y,
    vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
    g:0.15+Math.random()*0.12, drag:0.986,
    rot:Math.random()*6.28, vr:(Math.random()-0.5)*0.35,
    wob:Math.random()*6.28, wobs:0.05+Math.random()*0.06,
    sway:0.5+Math.random()*1.1,
    s:6+Math.random()*7,
    shape: kind<0.20?"e":(kind<0.60?"r":"c"),
    emoji: emo[(Math.random()*emo.length)|0],
    c:cols[(Math.random()*cols.length)|0],
    life:0, max:130+Math.random()*70
  });
}

function burst(){
  let wave=0;
  const t=setInterval(()=>{
    for(let i=0;i<18;i++){                              // bottom-left cannon -> up-right
      spawn(6, H*0.94, -Math.PI/3, 0.7, 19);
      spawn(W-6, H*0.94, -Math.PI*2/3, 0.7, 19);        // bottom-right cannon -> up-left
    }
    for(let i=0;i<12;i++) spawn(W/2, H*0.40, -Math.PI/2, Math.PI, 13); // center pop
    if(++wave>=6) clearInterval(t);
  },55);
}

function tick(){
  ctx.clearRect(0,0,W,H);
  for(const p of parts){
    p.vy+=p.g; p.vx*=p.drag; p.vy*=p.drag; p.wob+=p.wobs;
    p.x+=p.vx+Math.cos(p.wob)*p.sway; p.y+=p.vy; p.rot+=p.vr; p.life++;
    ctx.save();
    ctx.globalAlpha=Math.max(0,Math.min(1,(p.max-p.life)/45));
    ctx.translate(p.x,p.y); ctx.rotate(p.rot);
    if(p.shape==="e"){
      ctx.font=(p.s*2.5)+"px serif";
      ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.fillText(p.emoji,0,0);
    }else if(p.shape==="c"){
      ctx.fillStyle=p.c; ctx.beginPath(); ctx.arc(0,0,p.s*0.5,0,6.29); ctx.fill();
    }else{
      ctx.fillStyle=p.c; ctx.scale(1,Math.cos(p.wob*2)); // fluttering ribbon
      ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.7);
    }
    ctx.restore();
  }
  parts=parts.filter(p=>p.life<p.max && p.y<H+70);
  requestAnimationFrame(tick);
}
tick();

const btn=document.getElementById("celebrate");
btn.onclick=()=>{ burst(); btn.animate([{transform:'scale(.92)'},{transform:'scale(1)'}],{duration:220}); };
setTimeout(burst,700);            // auto-celebrate on load
setInterval(burst,11000);         // gentle re-celebrate to keep it lively
</script>
</body>
</html>
