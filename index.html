<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#ff6fae" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Happy Birthday 🎂</title>

<!-- ============================================================= -->
<!--  ✏️  EDIT THIS ONE BLOCK ONLY — everything else is automatic  -->
<!-- ============================================================= -->
<script>
const CARD = {
  // Her name (appears big on the card)
  name: "Aarthi",

  // The heartfelt message. Use \n for a new line.
  message:
    "Some people make the world a little brighter just by being themselves, " +
    "and today is a celebration of one of those people.\n\n" +
    "May your birthday be filled with genuine laughter, unforgettable " +
    "memories, and all the little moments that make life beautiful. 🌷\n\n" +
    "As you step into another wonderful year, I hope every dream you carry " +
    "finds its way to reality, every challenge turns into strength, and " +
    "every day brings you a new reason to smile. 🌈💖\n\n" +
    "May your heart always find peace, your mind always find confidence, " +
    "and your life always be surrounded by people who truly value you. 🌼\n\n" +
    "Thank you for being a part of my journey. I'll always wish the very " +
    "best for you.\n\n" +
    "Happy Birthday once again! 🥳🎂\n" +
    "May this year be your happiest one yet. ✨🌸💝",

  // Small signature at the bottom
  signature: "— With warmth and every good wish, always 🌸",

  // Photo file names. Put the image files inside the  photos/  folder
  // next to this file, then list their names here.
  photos: [
    "photo1.jpg",
    "photo7.jpg",
    "photo4.jpg",
    "photo8.jpg",
    "photo2.jpg",
    "photo9.jpg",
    "photo5.jpg",
    "photo3.jpg",
    "photo6.jpg"
  ],

  // OPTIONAL — her birth date "YYYY-MM-DD". Leave "" to hide the age/countdown.
  bornDate: "",

  // OPTIONAL — play a soft "Happy Birthday" melody automatically (browsers may
  // require a tap first; the intro tap counts). Set to false to keep it silent.
  music: true
};
</script>
<!-- ============================================================= -->

<style>
  :root{
    --pink:#ff6fae; --gold:#ffd76a; --deep:#1a0b2e; --deep2:#2d0a3e;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  /* gradient lives on <html> (not body) so iOS Safari doesn't jank the
     fixed background while scrolling, and it always covers the full canvas */
  html{
    min-height:100%;
    background:linear-gradient(160deg,#ff8ec6 0%,#ff6fae 32%,#e05fc4 60%,#a45fd8 100%);
    background-attachment:fixed;
    -webkit-text-size-adjust:100%;
  }
  body{
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    color:#fff;overflow-x:hidden;
    min-height:100vh;min-height:100svh;      /* svh = stable, ignores mobile toolbar */
    display:flex;flex-direction:column;align-items:center;
    position:relative;overscroll-behavior-y:none;
    -webkit-tap-highlight-color:transparent;
    padding:env(safe-area-inset-top) env(safe-area-inset-right)
            env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  /* ---------- floating hearts + sparkles background ---------- */
  .bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .float{position:absolute;bottom:-40px;font-size:22px;opacity:.55;
    animation:rise linear infinite}
  @keyframes rise{
    0%{transform:translateY(0) rotate(0);opacity:0}
    10%{opacity:.6}
    90%{opacity:.5}
    100%{transform:translateY(-115vh) rotate(360deg);opacity:0}
  }

  /* ---------- intro envelope ---------- */
  .intro{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:22px;cursor:pointer;
    background:radial-gradient(circle at 50% 40%,rgba(45,10,62,.35),rgba(26,11,46,.75));
    backdrop-filter:blur(3px);transition:opacity .8s ease,visibility .8s}
  .intro.gone{opacity:0;visibility:hidden}
  .env{position:relative;width:min(300px,72vw);aspect-ratio:3/2;
    filter:drop-shadow(0 24px 50px rgba(80,10,60,.55));
    animation:bob 3s ease-in-out infinite}
  .env .body{position:absolute;inset:0;border-radius:12px;
    background:linear-gradient(160deg,#fff0f7,#ffd6ec);overflow:hidden}
  .env .pocket{position:absolute;left:0;bottom:0;width:100%;height:62%;
    background:linear-gradient(160deg,#ffc3e2,#ff9ecf);
    clip-path:polygon(0 100%,0 18%,50% 78%,100% 18%,100% 100%)}
  .env .flap{position:absolute;left:0;top:0;width:100%;height:64%;
    background:linear-gradient(160deg,#ff9ecf,#ff7bbd);transform-origin:top;
    clip-path:polygon(0 0,100% 0,50% 96%);z-index:3;
    transition:transform .7s ease;box-shadow:0 4px 12px rgba(120,20,80,.25)}
  .env .letter{position:absolute;left:8%;top:14%;width:84%;height:70%;
    background:#fff;border-radius:8px;z-index:2;
    display:flex;align-items:center;justify-content:center;font-size:40px;
    box-shadow:0 6px 18px rgba(120,20,80,.2);transition:transform .7s ease .1s}
  .env .seal{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);
    z-index:5;font-size:34px;transition:opacity .4s;
    filter:drop-shadow(0 3px 6px rgba(120,20,80,.4))}
  .intro.opening .flap{transform:rotateX(180deg)}
  .intro.opening .letter{transform:translateY(-42%) scale(1.04)}
  .intro.opening .seal{opacity:0}
  .intro h2{font-size:clamp(22px,5vw,34px);font-weight:800;
    text-shadow:0 3px 16px rgba(120,20,80,.5)}
  .intro .tap{font-size:15px;opacity:.9;animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.45;transform:scale(.97)}}

  .card{
    position:relative;z-index:2;max-width:680px;width:92%;
    margin:6vh 0 8vh;text-align:center;
    opacity:0;transform:translateY(40px);
  }
  .card.show{animation:fadeUp 1.1s ease both}
  @keyframes fadeUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}

  .cake{font-size:64px;letter-spacing:6px;
    filter:drop-shadow(0 6px 14px rgba(150,40,110,.45));
    animation:bob 3s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-12px)}}
  .panda-note{margin-top:8px;font-size:clamp(14px,2.3vw,17px);color:#fff;
    font-weight:600;letter-spacing:.3px;text-shadow:0 2px 12px rgba(150,40,110,.45)}

  h1{font-size:clamp(34px,7vw,64px);line-height:1.05;margin:6px 0 2px;
    font-weight:800;letter-spacing:.5px}
  h1 .hb{
    background:linear-gradient(90deg,var(--gold),#fff,var(--gold));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    background-size:200% auto;animation:shine 4s linear infinite}
  @keyframes shine{to{background-position:200% center}}

  .name{
    display:block;font-family:"Brush Script MT","Segoe Script",cursive;
    font-size:clamp(46px,11vw,92px);
    background:linear-gradient(90deg,#fff,#ffe6f3,#fff);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    margin-top:4px;text-shadow:0 3px 24px rgba(150,40,110,.45)}

  .age{margin-top:6px;font-size:clamp(13px,2.2vw,16px);font-weight:600;
    color:#fff;opacity:.95;text-shadow:0 2px 12px rgba(150,40,110,.4)}
  .age b{color:var(--gold)}

  /* ---------- interactive cake / candles ---------- */
  .bigcake{margin:22px auto 4px;position:relative;width:min(280px,72vw);
    user-select:none}
  .bigcake .cakeart{font-size:clamp(70px,18vw,120px);line-height:1;
    filter:drop-shadow(0 10px 20px rgba(120,20,80,.4))}
  .candles{position:absolute;left:50%;top:6%;transform:translateX(-50%);
    display:flex;gap:clamp(6px,2.4vw,14px)}
  .flame{width:10px;height:16px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
    background:radial-gradient(circle at 50% 70%,#fff 0%,#ffe07a 35%,#ff8a3d 75%,#ff4d2e 100%);
    box-shadow:0 0 14px 4px rgba(255,160,60,.8);transform-origin:bottom;
    animation:flicker .28s ease-in-out infinite alternate}
  @keyframes flicker{from{transform:scaleY(1) rotate(-3deg)}to{transform:scaleY(1.18) rotate(3deg)}}
  .flame.out{opacity:0;box-shadow:none;transition:opacity .3s}
  .blowhint{margin-top:6px;font-size:13px;opacity:.9;min-height:18px}

  /* ---------- photo carousel ---------- */
  .frame{
    margin:26px auto 8px;width:min(340px,80vw);aspect-ratio:4/5;
    border-radius:20px;position:relative;overflow:hidden;cursor:pointer;
    box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 0 6px rgba(255,255,255,.08);
    background:rgba(255,255,255,.05);touch-action:pan-y}
  .frame::after{content:"";position:absolute;inset:0;border-radius:20px;
    box-shadow:inset 0 0 60px rgba(255,111,174,.25);pointer-events:none}
  .slide{position:absolute;inset:0;opacity:0;transform:scale(1.08);
    transition:opacity 1.1s ease,transform 6s ease;
    background-size:cover;background-position:center}
  .slide.on{opacity:1;transform:scale(1)}
  .no-photo{display:flex;align-items:center;justify-content:center;
    height:100%;flex-direction:column;gap:10px;color:#ffd0e6;font-size:15px;
    text-align:center;padding:20px;line-height:1.6}
  .zoomtip{position:absolute;right:10px;bottom:10px;z-index:4;
    background:rgba(0,0,0,.4);color:#fff;font-size:12px;padding:5px 10px;
    border-radius:20px;pointer-events:none;opacity:.85}
  .dots{display:flex;gap:6px;justify-content:center;margin:12px 0 4px}
  .dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.3);
    cursor:pointer;transition:.3s;position:relative}
  /* bigger invisible tap target (~34px) so dots are easy to hit on a phone */
  .dot::before{content:"";position:absolute;inset:-12px}
  .dot.on{background:var(--pink);transform:scale(1.3)}

  /* ---------- lightbox ---------- */
  .lightbox{position:fixed;inset:0;z-index:60;display:none;
    align-items:center;justify-content:center;background:rgba(10,2,18,.92);
    padding:20px}
  .lightbox.open{display:flex}
  .lightbox img{max-width:94vw;max-height:86vh;border-radius:14px;
    box-shadow:0 30px 80px rgba(0,0,0,.6);animation:fadeUp .4s ease both}
  .lb-x{position:absolute;top:16px;right:20px;font-size:34px;color:#fff;
    cursor:pointer;line-height:1;opacity:.85}
  .lb-nav{position:absolute;top:50%;transform:translateY(-50%);font-size:44px;
    color:#fff;cursor:pointer;user-select:none;opacity:.75;padding:10px}
  .lb-prev{left:8px}.lb-next{right:8px}

  .msg{
    margin:26px auto 0;max-width:560px;font-size:clamp(16px,2.4vw,19px);
    line-height:1.85;color:#5b2a4d;white-space:pre-wrap;min-height:120px;
    background:rgba(255,255,255,.82);backdrop-filter:blur(4px);
    padding:28px 26px;border-radius:22px;text-align:left;
    border:2px solid rgba(255,255,255,.9);
    box-shadow:0 16px 40px rgba(150,40,110,.25)}
  .msg .cursor{display:inline-block;width:2px;margin-left:1px;
    background:#c94f9a;animation:blink .8s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .sig{margin-top:18px;font-style:italic;color:#fff;font-size:17px;
    text-shadow:0 2px 12px rgba(150,40,110,.4)}

  .actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:30px}
  .btn{display:inline-block;cursor:pointer;
    padding:14px 28px;border:none;border-radius:50px;font-size:16px;
    font-weight:700;color:#3a0d55;
    background:linear-gradient(90deg,var(--gold),#ffe9a8);
    box-shadow:0 10px 30px rgba(255,215,106,.4);transition:transform .2s}
  .btn:hover{transform:translateY(-3px) scale(1.04)}
  .btn.ghost{background:rgba(255,255,255,.18);color:#fff;
    border:2px solid rgba(255,255,255,.55);box-shadow:none}

  /* ---------- music toggle ---------- */
  .music{position:fixed;z-index:30;width:50px;height:50px;
    top:calc(12px + env(safe-area-inset-top));
    right:calc(12px + env(safe-area-inset-right));
    border-radius:50%;cursor:pointer;font-size:20px;
    background:rgba(255,255,255,.22);color:#fff;backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.4);transition:transform .2s}
  .music:hover{transform:scale(1.08)}
  .music.playing{animation:spin 6s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- balloons ---------- */
  .balloons{position:fixed;inset:0;pointer-events:none;z-index:15;overflow:hidden}
  .balloon{position:absolute;bottom:-140px;font-size:44px;cursor:pointer;
    pointer-events:auto;filter:drop-shadow(0 8px 10px rgba(100,20,70,.35));
    animation:floatUp linear forwards}
  .balloon.pop{animation:popOut .35s ease forwards}
  @keyframes floatUp{to{transform:translateY(-120vh) translateX(var(--drift,0))}}
  @keyframes popOut{to{transform:scale(1.8);opacity:0}}

  canvas.confetti{position:fixed;inset:0;pointer-events:none;z-index:20}
  .toast{position:fixed;left:50%;transform:translateX(-50%) translateY(30px);
    bottom:calc(20px + env(safe-area-inset-bottom));
    background:rgba(30,8,45,.9);color:#fff;padding:12px 22px;border-radius:40px;
    font-size:14px;z-index:70;opacity:0;transition:.4s;pointer-events:none;
    max-width:88vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ---------- phone-specific tuning ---------- */
  @media (max-width:560px){
    .card{width:94%;margin:4vh 0 7vh}
    .cake{font-size:52px;letter-spacing:4px}
    .bigcake{margin:16px auto 4px}
    .frame{margin:20px auto 8px;width:min(320px,86vw)}
    .msg{padding:22px 20px;line-height:1.8;margin-top:22px}
    .actions{gap:10px;margin-top:24px}
    .btn{flex:1 1 40%;min-width:140px;padding:15px 18px}   /* comfy thumb targets */
    .intro h2{padding:0 20px}
  }
  /* disable heavy blur on small screens where it costs the most */
  @media (max-width:560px){
    .msg{backdrop-filter:none}
    .music{backdrop-filter:none}
  }
  @media (prefers-reduced-motion:reduce){
    .cake,.env,.flame,.float,.balloon{animation:none!important}
  }
</style>
</head>
<body>
  <div class="bg" id="bg"></div>
  <div class="balloons" id="balloons"></div>

  <!-- intro envelope -->
  <div class="intro" id="intro">
    <div class="env">
      <div class="body">
        <div class="pocket"></div>
        <div class="letter">💌</div>
      </div>
      <div class="flap"></div>
      <div class="seal">🌸</div>
    </div>
    <h2>A little something for you…</h2>
    <div class="tap">tap to open 💗</div>
  </div>

  <button class="music" id="music" title="Toggle music">🔇</button>

  <div class="card" id="card">
    <div class="cake">🐼🎂🐼</div>
    <h1><span class="hb">Happy Birthday</span></h1>
    <span class="name" id="name">Name</span>
    <div class="age" id="age"></div>
    <div class="panda-note">a little panda hug, just for you 🐼🎋💕</div>

    <div class="bigcake" id="bigcake">
      <div class="candles" id="candles"></div>
      <div class="cakeart">🎂</div>
      <div class="blowhint" id="blowhint"></div>
    </div>

    <div class="frame" id="frame">
      <div class="zoomtip">tap to enlarge</div>
    </div>
    <div class="dots" id="dots"></div>

    <div class="msg" id="msg"></div>
    <div class="sig" id="sig"></div>

    <div class="actions">
      <button class="btn" id="celebrate">🎉 Celebrate</button>
    </div>
  </div>

  <!-- lightbox -->
  <div class="lightbox" id="lightbox">
    <span class="lb-x" id="lbx">×</span>
    <span class="lb-nav lb-prev" id="lbprev">‹</span>
    <img id="lbimg" alt="photo" />
    <span class="lb-nav lb-next" id="lbnext">›</span>
  </div>

  <canvas class="confetti" id="cv"></canvas>
  <div class="toast" id="toast"></div>

<script>
/* ---------- fill content ---------- */
document.title = "Happy Birthday " + CARD.name + " 🎂";
document.getElementById("name").textContent = CARD.name;
document.getElementById("sig").textContent = CARD.signature;

/* ---------- age / countdown ---------- */
(function(){
  if(!CARD.bornDate) return;
  const born = new Date(CARD.bornDate);
  if(isNaN(born)) return;
  const now = new Date();
  let age = now.getFullYear() - born.getFullYear();
  const next = new Date(now.getFullYear(), born.getMonth(), born.getDate());
  const isToday = next.toDateString() === now.toDateString();
  if(next < now && !isToday) next.setFullYear(now.getFullYear()+1);
  const el = document.getElementById("age");
  if(isToday){
    el.innerHTML = "🎉 Turning <b>"+(age)+"</b> today! 🎉";
  }else{
    if(now.getMonth()>born.getMonth() ||
      (now.getMonth()===born.getMonth() && now.getDate()>=born.getDate())){}
    else age--;
    const days = Math.ceil((next - now)/86400000);
    el.innerHTML = "Currently <b>"+age+"</b> · next birthday in <b>"+days+"</b> day"+(days===1?"":"s")+" 🎈";
  }
})();

/* device profile — phones get fewer particles and no cursor trail */
const MOBILE = innerWidth < 640 || matchMedia("(pointer:coarse)").matches;
const FINE_POINTER = matchMedia("(pointer:fine)").matches;

/* ---------- floating hearts ---------- */
const bg = document.getElementById("bg");
const emojis = ["🐼","🐼","🎋","💖","🌸","🐾","🐼","💗","✨","🎀","🐼","🌷"];
for(let i=0;i<(MOBILE?14:26);i++){
  const s=document.createElement("div");
  s.className="float";
  s.textContent=emojis[Math.floor(Math.random()*emojis.length)];
  s.style.left=Math.random()*100+"vw";
  s.style.fontSize=(14+Math.random()*24)+"px";
  s.style.animationDuration=(9+Math.random()*11)+"s";
  s.style.animationDelay=(-Math.random()*15)+"s";
  bg.appendChild(s);
}

/* ---------- photo carousel + lightbox ---------- */
const frame=document.getElementById("frame");
const dotsWrap=document.getElementById("dots");
const photoList=CARD.photos.filter(Boolean);
let slides=[],cur=0,autoTimer=null;

function buildGallery(){
  if(photoList.length===0){
    frame.innerHTML='<div class="no-photo">📷<br>Add her photos to the '+
      '<b>photos</b> folder<br>and list the file names in the script.</div>';
    return;
  }
  photoList.forEach((src,i)=>{
    const d=document.createElement("div");
    d.className="slide"+(i===0?" on":"");
    d.style.backgroundImage=`url("photos/${src}")`;
    frame.appendChild(d);
    slides.push(d);
    const dot=document.createElement("div");
    dot.className="dot"+(i===0?" on":"");
    dot.onclick=(e)=>{e.stopPropagation();go(i);restartAuto();};
    dotsWrap.appendChild(dot);
  });
  if(photoList.length>1) restartAuto();
}
function restartAuto(){
  clearInterval(autoTimer);
  if(photoList.length>1) autoTimer=setInterval(()=>go((cur+1)%slides.length),4200);
}
function go(n){
  if(!slides.length) return;
  slides[cur].classList.remove("on");
  dotsWrap.children[cur].classList.remove("on");
  cur=(n+slides.length)%slides.length;
  slides[cur].classList.add("on");
  dotsWrap.children[cur].classList.add("on");
}
buildGallery();

/* swipe on the frame */
let tsx=null,swiped=false;
frame.addEventListener("touchstart",e=>{tsx=e.touches[0].clientX;swiped=false;},{passive:true});
frame.addEventListener("touchend",e=>{
  if(tsx===null) return;
  const dx=e.changedTouches[0].clientX-tsx;
  if(Math.abs(dx)>45){ dx<0?go(cur+1):go(cur-1); restartAuto(); swiped=true; }
  tsx=null;
});

/* lightbox */
const lb=document.getElementById("lightbox"),lbimg=document.getElementById("lbimg");
function openLB(){ if(swiped){swiped=false;return;} if(!photoList.length) return; lbimg.src="photos/"+photoList[cur]; lb.classList.add("open"); }
function closeLB(){ lb.classList.remove("open"); }
function lbGo(d){ go(cur+d); lbimg.src="photos/"+photoList[cur]; }
frame.addEventListener("click",openLB);
document.getElementById("lbx").onclick=closeLB;
document.getElementById("lbprev").onclick=e=>{e.stopPropagation();lbGo(-1);};
document.getElementById("lbnext").onclick=e=>{e.stopPropagation();lbGo(1);};
lb.addEventListener("click",e=>{ if(e.target===lb) closeLB(); });
addEventListener("keydown",e=>{
  if(!lb.classList.contains("open")) return;
  if(e.key==="Escape") closeLB();
  if(e.key==="ArrowRight") lbGo(1);
  if(e.key==="ArrowLeft") lbGo(-1);
});

/* ---------- typewriter message ---------- */
const msgEl=document.getElementById("msg");
let typed=false;
function typeMessage(){
  if(typed) return; typed=true;
  const text=CARD.message;
  msgEl.innerHTML='<span class="body"></span><span class="cursor">&nbsp;</span>';
  const body=msgEl.querySelector(".body");
  let i=0;
  (function step(){
    if(i<=text.length){
      body.textContent=text.slice(0,i);
      i += text[i-1]==="\n" ? 1 : (1+Math.round(Math.random()));
      setTimeout(step, text[i-1]==="\n"?60:14);
    }else{
      body.textContent=text;
      setTimeout(()=>{const c=msgEl.querySelector(".cursor"); if(c) c.remove();},1200);
    }
  })();
}

/* ---------- confetti + fireworks ---------- */
const cv=document.getElementById("cv"),ctx=cv.getContext("2d");
let W,H,parts=[];
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight}
size();addEventListener("resize",size);

const cols=["#ff4f93","#ff6fae","#ffb3d9","#ffd76a","#ffffff","#b388ff","#7ee8fa","#ff9ec7"];
const emo=["🐼","🌸","💖","🎋","🎀","🌷","✨"];

function spawn(x,y,ang,spread,power){
  const a=ang+(Math.random()-0.5)*spread;
  const sp=power*(0.55+Math.random()*0.7);
  const kind=Math.random();
  parts.push({
    x,y,
    vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
    g:0.15+Math.random()*0.12, drag:0.986,
    rot:Math.random()*6.28, vr:(Math.random()-0.5)*0.35,
    wob:Math.random()*6.28, wobs:0.05+Math.random()*0.06,
    sway:0.5+Math.random()*1.1,
    s:6+Math.random()*7,
    shape: kind<0.20?"e":(kind<0.60?"r":"c"),
    emoji: emo[(Math.random()*emo.length)|0],
    c:cols[(Math.random()*cols.length)|0],
    life:0, max:130+Math.random()*70
  });
}
/* firework: a spark that fades fast, ignores gravity mostly */
function firework(x,y){
  const c=cols[(Math.random()*cols.length)|0];
  const n=MOBILE?20:34;
  for(let i=0;i<n;i++){
    const a=(i/n)*6.283, sp=2+Math.random()*3.4;
    parts.push({
      x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
      g:0.03,drag:0.94,rot:0,vr:0,wob:0,wobs:0,sway:0,
      s:3+Math.random()*2,shape:"c",c,life:0,max:60+Math.random()*30
    });
  }
}

function burst(){
  let wave=0;
  const side=MOBILE?9:18, mid=MOBILE?6:12, waves=MOBILE?4:6;
  const t=setInterval(()=>{
    for(let i=0;i<side;i++){
      spawn(6, H*0.94, -Math.PI/3, 0.7, 19);
      spawn(W-6, H*0.94, -Math.PI*2/3, 0.7, 19);
    }
    for(let i=0;i<mid;i++) spawn(W/2, H*0.40, -Math.PI/2, Math.PI, 13);
    if(++wave>=waves) clearInterval(t);
  },55);
  /* a couple of fireworks up top */
  for(let k=0;k<3;k++) setTimeout(()=>firework(W*(0.2+Math.random()*0.6),H*(0.2+Math.random()*0.25)),k*260);
}

function tick(){
  ctx.clearRect(0,0,W,H);
  for(const p of parts){
    p.vy+=p.g; p.vx*=p.drag; p.vy*=p.drag; p.wob+=p.wobs;
    p.x+=p.vx+Math.cos(p.wob)*p.sway; p.y+=p.vy; p.rot+=p.vr; p.life++;
    ctx.save();
    ctx.globalAlpha=Math.max(0,Math.min(1,(p.max-p.life)/45));
    ctx.translate(p.x,p.y); ctx.rotate(p.rot);
    if(p.shape==="e"){
      ctx.font=(p.s*2.5)+"px serif";
      ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.fillText(p.emoji,0,0);
    }else if(p.shape==="c"){
      ctx.fillStyle=p.c; ctx.beginPath(); ctx.arc(0,0,p.s*0.5,0,6.29); ctx.fill();
    }else{
      ctx.fillStyle=p.c; ctx.scale(1,Math.cos(p.wob*2));
      ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.7);
    }
    ctx.restore();
  }
  parts=parts.filter(p=>p.life<p.max && p.y<H+70);
  requestAnimationFrame(tick);
}
tick();

/* ---------- pop-able balloons ---------- */
const balloonWrap=document.getElementById("balloons");
const balloonEmojis=["🎈","🎈","🎈","🎈"];
const balloonColors=["hue-rotate(0deg)","hue-rotate(60deg)","hue-rotate(140deg)","hue-rotate(220deg)","hue-rotate(300deg)"];
function launchBalloon(){
  const b=document.createElement("div");
  b.className="balloon";
  b.textContent=balloonEmojis[(Math.random()*balloonEmojis.length)|0];
  b.style.left=(Math.random()*88+4)+"vw";
  b.style.setProperty("--drift",(Math.random()*80-40)+"px");
  b.style.filter=balloonColors[(Math.random()*balloonColors.length)|0]+" drop-shadow(0 8px 10px rgba(100,20,70,.35))";
  b.style.animationDuration=(9+Math.random()*7)+"s";
  b.style.fontSize=(34+Math.random()*22)+"px";
  b.addEventListener("click",()=>{
    b.classList.add("pop"); b.textContent="💥"; beep(660,0.08);
    const r=b.getBoundingClientRect();
    firework(r.left+r.width/2, r.top+r.height/2);
    setTimeout(()=>b.remove(),350);
  });
  b.addEventListener("animationend",()=>b.remove());
  balloonWrap.appendChild(b);
}

/* ---------- WebAudio: melody + blips ---------- */
let AC=null, musicOn=false, melodyTimer=null;
function ac(){
  if(!AC){
    const Ctx=window.AudioContext||window.webkitAudioContext;
    /* latencyHint 'playback' asks the OS to treat this as media audio
       (loudspeaker) rather than communication audio (earpiece) */
    try{ AC=new Ctx({latencyHint:"playback"}); }catch(e){ AC=new Ctx(); }
  }
  return AC;
}
function beep(freq,dur,type,vol){
  try{
    const c=ac(); const o=c.createOscillator(), g=c.createGain();
    o.type=type||"triangle"; o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,c.currentTime);
    g.gain.exponentialRampToValueAtTime(vol||0.14,c.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+dur);
    o.connect(g).connect(c.destination); o.start(); o.stop(c.currentTime+dur+0.02);
  }catch(e){}
}
/* Happy Birthday melody (note, beats) */
const N={G3:196,A3:220,B3:246.9,C4:261.6,D4:293.7,E4:329.6,F4:349.2,G4:392,A4:440,B4:493.9,C5:523.3,D5:587.3,F5:698.5};
const HB=[
  ["G3",.5],["G3",.5],["A3",1],["G3",1],["C4",1],["B3",2],
  ["G3",.5],["G3",.5],["A3",1],["G3",1],["D4",1],["C4",2],
  ["G3",.5],["G3",.5],["G4",1],["E4",1],["C4",1],["B3",1],["A3",2],
  ["F4",.5],["F4",.5],["E4",1],["C4",1],["D4",1],["C4",2]
];
function playMelody(){
  const beat=0.42; let t=0;
  HB.forEach(([n,b])=>{
    setTimeout(()=>{ if(musicOn) beep(N[n],b*beat*0.9,"triangle",0.12); }, t*1000);
    t+=b*beat;
  });
  melodyTimer=setTimeout(()=>{ if(musicOn) playMelody(); }, (t+1.5)*1000);
}
const musicBtn=document.getElementById("music");
function startMusic(){
  if(musicOn) return;
  musicOn=true; musicBtn.textContent="🎵"; musicBtn.classList.add("playing");
  ac().resume&&ac().resume(); playMelody();
}
function stopMusic(){
  musicOn=false; musicBtn.textContent="🔇"; musicBtn.classList.remove("playing");
  clearTimeout(melodyTimer);
}
musicBtn.onclick=()=> musicOn?stopMusic():startMusic();

/* ---------- interactive candles (mic blow / tap) ---------- */
const candlesWrap=document.getElementById("candles");
const blowhint=document.getElementById("blowhint");
let candleCount = CARD.bornDate ? Math.min(12, Math.max(3, (new Date().getFullYear()-new Date(CARD.bornDate).getFullYear())%12 || 5)) : 5;
let flames=[];
function buildCandles(){
  for(let i=0;i<candleCount;i++){
    const f=document.createElement("div"); f.className="flame"; candlesWrap.appendChild(f); flames.push(f);
  }
  blowhint.textContent="🌬️ tap the cake to blow out the candles";
}
buildCandles();
let candlesOut=false;
function blowOut(){
  if(candlesOut) return; candlesOut=true;
  flames.forEach((f,i)=>setTimeout(()=>f.classList.add("out"),i*120));
  setTimeout(()=>{
    blowhint.textContent="✨ Make a wish! ✨";
    burst(); toast("Your wish is on its way ✨");
  }, flames.length*120+200);
}
document.getElementById("bigcake").addEventListener("click",blowOut);
/* NOTE: microphone "blow" detection was removed on purpose — calling
   getUserMedia() forces mobile browsers into voice-call audio mode, which
   routes the music to the earpiece instead of the loudspeaker. Tapping the
   cake blows out the candles reliably and keeps audio on the main speaker. */

/* ---------- cursor sparkle trail ---------- */
let lastSpark=0;
function sparkAt(x,y){
  const s=document.createElement("div");
  s.textContent=["✨","💖","🌸","⭐","🐾"][(Math.random()*5)|0];
  s.style.cssText="position:fixed;left:"+x+"px;top:"+y+"px;pointer-events:none;"+
    "z-index:25;font-size:"+(12+Math.random()*10)+"px;transform:translate(-50%,-50%);"+
    "transition:transform .8s ease,opacity .8s ease;opacity:1";
  document.body.appendChild(s);
  requestAnimationFrame(()=>{
    s.style.transform="translate(-50%,-50%) translateY(-26px) scale(.4)";
    s.style.opacity="0";
  });
  setTimeout(()=>s.remove(),820);
}
/* only on real mouse pointers — on touch this would fire on every scroll-drag */
if(FINE_POINTER){
  addEventListener("pointermove",e=>{
    const now=performance.now();
    if(now-lastSpark>60){ lastSpark=now; sparkAt(e.clientX,e.clientY); }
  });
}

/* ---------- toast ---------- */
const toastEl=document.getElementById("toast");
let toastTimer;
function toast(t){
  toastEl.textContent=t; toastEl.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>toastEl.classList.remove("show"),2600);
}

/* ---------- celebrate button ---------- */
const celebrateBtn=document.getElementById("celebrate");
celebrateBtn.onclick=()=>{
  burst(); beep(880,0.12,"triangle",0.1);
  for(let i=0;i<3;i++) setTimeout(launchBalloon,i*180);
  celebrateBtn.animate([{transform:'scale(.92)'},{transform:'scale(1)'}],{duration:220});
};

/* ---------- intro open -> start everything ---------- */
const intro=document.getElementById("intro");
const card=document.getElementById("card");
let opened=false;
function openCard(){
  if(opened) return; opened=true;
  intro.classList.add("opening");
  setTimeout(()=>intro.classList.add("gone"),650);
  setTimeout(()=>{
    card.classList.add("show");
    typeMessage();
    burst();
    if(CARD.music) startMusic();
    for(let i=0;i<5;i++) setTimeout(launchBalloon,i*400);
    setInterval(launchBalloon, 3500);
  }, 700);
}
intro.addEventListener("click",openCard);

/* keep it lively */
setInterval(()=>{ if(opened) burst(); },14000);
</script>
